<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Canary logo: a yellow canary in a miner's helmet">
  <defs>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF4B8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF4B8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4B8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF4B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- coal-dark tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#1E2230"/>

  <g clip-path="url(#tile)">
    <!-- headlamp beam -->
    <polygon points="306,138 520,40 520,250" fill="url(#beam)"/>
    <!-- coal lumps -->
    <path d="M40,470 L92,428 L150,446 L176,500 L40,500 Z" fill="#2C3242"/>
    <path d="M330,500 L364,446 L420,432 L470,462 L480,500 Z" fill="#2C3242"/>
    <path d="M150,500 L196,462 L246,474 L268,500 Z" fill="#262B39"/>
    <circle cx="430" cy="96" r="3" fill="#FFF4B8" opacity="0.7"/>
    <circle cx="458" cy="150" r="2.5" fill="#FFF4B8" opacity="0.6"/>
    <circle cx="404" cy="172" r="2" fill="#FFF4B8" opacity="0.5"/>
  </g>

  <!-- perch -->
  <rect x="104" y="388" width="304" height="24" rx="12" fill="#7A5A41"/>
  <rect x="104" y="388" width="304" height="8" rx="4" fill="#94704F"/>

  <!-- tail -->
  <path d="M150,300 Q96,316 82,368 Q120,352 160,336 Z" fill="#F2B705"/>

  <!-- feet -->
  <g stroke="#FF8C1A" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M226,372 L222,392 M222,392 L210,398 M222,392 L232,399"/>
    <path d="M282,372 L284,392 M284,392 L272,399 M284,392 L296,398"/>
  </g>

  <!-- body -->
  <ellipse cx="252" cy="292" rx="116" ry="96" fill="#FFD23F"/>
  <ellipse cx="274" cy="322" rx="76" ry="56" fill="#FFE98F"/>
  <!-- wing -->
  <ellipse cx="206" cy="300" rx="64" ry="42" transform="rotate(-18 206 300)" fill="#F2B705"/>
  <path d="M168,300 Q200,318 236,304" stroke="#E0A400" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="292" cy="206" r="80" fill="#FFD23F"/>

  <!-- helmet -->
  <path d="M214,176 A78,72 0 0 1 370,176 Z" fill="#3A4256"/>
  <path d="M232,150 A62,54 0 0 1 300,116" stroke="#4C5670" stroke-width="7" fill="none" stroke-linecap="round"/>
  <rect x="204" y="170" width="176" height="16" rx="8" fill="#2A3040"/>
  <circle cx="306" cy="138" r="30" fill="url(#glow)"/>
  <circle cx="306" cy="138" r="15" fill="#FFF6C7" stroke="#C9A227" stroke-width="4"/>

  <!-- face -->
  <circle cx="318" cy="214" r="17" fill="#1E2230"/>
  <circle cx="324" cy="208" r="6" fill="#FFFFFF"/>
  <circle cx="312" cy="221" r="2.5" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="334" cy="248" rx="15" ry="9" fill="#FF9AA2" opacity="0.85"/>
  <path d="M364,214 Q392,222 400,230 Q390,240 364,244 Z" fill="#FF8C1A"/>
  <path d="M366,230 L394,231" stroke="#E07000" stroke-width="3" stroke-linecap="round"/>
</svg>
