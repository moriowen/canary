[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canary"
version = "0.1.0"
description = "Early warning for failing coding-agent runs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "scikit-learn",
    "huggingface_hub",
]

[project.optional-dependencies]
train = ["lightgbm", "torch", "transformers", "matplotlib", "pytest"]
dev = ["pytest", "jupyter", "ipykernel", "matplotlib", "seaborn", "lightgbm"]

[project.scripts]
canary = "canary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
